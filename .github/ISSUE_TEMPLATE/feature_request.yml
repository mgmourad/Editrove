name: Feature request
description: Suggest a feature or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the feature and why it matters.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve for you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, or anything else.
